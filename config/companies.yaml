# All UK Tech: the names we track for coverage trends
#
# Every story that passes the site's rules is checked against these names. The matches are saved
# day by day so we can see who the UK tech press is writing about more (or less) than usual.
# Nothing here changes what appears on the site or in the email.
#
# Companies, plus a few regulators and public bodies that drive a lot of UK tech news.
# Add, remove or edit freely. Changes apply on the next hourly run (past days keep the old matches).
#
# id:       short name used in the database. Don't change it once set, or the history splits in two.
# name:     shown in reports
# group:    uk-tech, fintech, telecoms, big-tech, chips, security, banks, regulator, public
# aliases:  words that tag a story, matched on whole words, any case ("Monzo", "monzo's")
# exact:    words matched with exact capitals only, for names that are also everyday words
#           ("Arm" the company, not "arm" the body part)
# ignore:   phrases that look like the name but aren't the company ("investment arm")
#
# A company is only tagged when enough of a story's coverage is about it: named in at least a
# quarter of the headlines, or in the text of half the articles. A passing mention doesn't count.

companies:
