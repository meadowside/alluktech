# All UK Tech: source list
#
# tier:      1 national, 2 UK specialist, 3 global tech, 4 primary, 0 backfill
# weight:    what one write-up from this outlet adds to a story's coverage score
# sections:  where this source's stories usually belong (a hint, keywords win)
# paywall:   true adds a £ tag when we have to link it
# standalone: a primary source that can run with no outlet coverage (regulators)
# confirm:   a primary source that needs one outlet to cover the story too
# uk_angle:  true means the story only counts if it has a UK angle
# domain:    used to match Google News items back to this outlet
#
# Every URL below needs checking once the engine runs for real.
# Run `python run.py hourly` and then open site/status.html to see which feeds work.

sources:
  # ---------- Tier 1: national ----------
  - id: bbc-tech
    name: BBC
    url: https://feeds.bbci.co.uk/news/technology/rss.xml
    domain: bbc.co.uk
    tier: 1
    weight: 3
    sections: [big-tech, ai, policy, security]

  - id: guardian-tech
